name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit health endpoint
        run: |
          curl -fsS \
            --connect-timeout 15 \
            --max-time 120 \
            --retry 4 \
            --retry-delay 10 \
            --retry-all-errors \
            --retry-max-time 300 \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            "https://kodbank-7ga2.onrender.com/actuator/health"
