services:
  - type: web
    name: kodbank
    runtime: docker
    plan: free
    # TiDB DB is in ap-southeast-1 (Singapore) — keep app in same region
    # to avoid ~180ms cross-ocean SQL latency (was causing 143s startup).
    # NOTE: Render cannot change region on an existing service — recreate it in Singapore.
    region: singapore
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.onrender.com,http://localhost:*,http://127.0.0.1:*"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PIN
        sync: false
      - key: ADMIN_CARD
        value: "9999999999999999"
      - key: ADMIN_SECURITY_ANSWER
        sync: false
      - key: OTP_INCLUDE_CODE
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: SPRING_PROFILES_ACTIVE
        value: prod
