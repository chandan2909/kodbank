services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: atm
      MYSQL_USER: kodbank
      MYSQL_PASSWORD: ${DB_PASSWORD:-kodbank}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    # No host port publish — app reaches MySQL at db:3306 inside the network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/atm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: kodbank
      DB_PASSWORD: ${DB_PASSWORD:-kodbank}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-bytes}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PIN: ${ADMIN_PIN:-9090}
      ADMIN_CARD: ${ADMIN_CARD:-9999999999999999}
      ADMIN_SECURITY_ANSWER: ${ADMIN_SECURITY_ANSWER:-KodBank}
      OTP_INCLUDE_CODE: ${OTP_INCLUDE_CODE:-true}
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  db_data:
